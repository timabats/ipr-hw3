services:
  app:
    build: .
    environment:
      - GREETING=${GREETING}
      - STORAGE=redis
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "127.0.0.1:${PORT:-8080}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", 'import urllib.request, os; urllib.request.urlopen("http://localhost:8000/healthz")']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    cpus: 1
    mem_limit: 256m
    read_only: true
    user: "10001:10001"

  redis:
    image: redis:7.4-alpine
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  data:
